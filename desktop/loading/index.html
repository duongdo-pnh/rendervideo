<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Byscom Render</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f172a; color: #cbd5e1;
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  }
  .wrap { text-align: center; width: min(760px, calc(100% - 48px)); padding: 24px; max-height: calc(100vh - 48px); overflow-y: auto; }
  [hidden] { display: none !important; }
  #detail { white-space: pre-wrap; overflow-wrap: anywhere; }
  button { background: #4f46e5; color: white; border: 0; border-radius: 8px; padding: 12px 22px; cursor: pointer; }
  #progress-panel { text-align: left; margin: 24px 0 16px; }
  .progress-header { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; margin-bottom: 10px; }
  progress { width: 100%; height: 12px; appearance: none; border: 0; border-radius: 8px; overflow: hidden; background: #334155; }
  progress::-webkit-progress-bar { background: #334155; }
  progress::-webkit-progress-value { background: #818cf8; transition: width .4s ease; }
  progress::-moz-progress-bar { background: #818cf8; }
  #stage { color: #e2e8f0; font-size: 14px; margin-top: 12px; }
  #progress-note { color: #94a3b8; font-size: 12px; line-height: 1.6; }
  details { margin: 16px 0; text-align: left; }
  summary { cursor: pointer; font-size: 13px; color: #a5b4fc; }
  #install-log { background: #020617; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 12px; max-height: 230px; overflow: auto; font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .badge {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 18px;
  }
  .spinner {
    width: 22px; height: 22px; margin: 18px auto 0;
    border: 2.5px solid #334155; border-top-color: #818cf8; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 13px; color: #64748b; margin-top: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">BR</div>
    <div id="title">Đang khởi động Byscom Render…</div>
    <div class="spinner"></div>
    <p id="detail">Đang chờ backend sẵn sàng</p>
    <section id="progress-panel" hidden aria-label="Tiến trình cài môi trường">
      <div class="progress-header"><span id="progress-count">0/8 bước hoàn tất</span><span id="elapsed">Đã chạy 00:00</span></div>
      <progress id="install-progress" max="8" value="0" aria-label="Số bước cài đặt hoàn tất"></progress>
      <div id="stage" role="status" aria-live="polite">Đang chuẩn bị bộ cài…</div>
      <p id="progress-note">Tiến trình tính theo bước, không phải thời gian hoặc dung lượng tải. Bước tải model có thể kéo dài.</p>
      <details open><summary>Nhật ký cài đặt trực tiếp</summary><pre id="install-log" tabindex="0" aria-label="Nhật ký cài đặt">Đang chờ nhật ký…</pre></details>
    </section>
    <button id="install" hidden>Cài môi trường</button>
    <button id="retry" hidden>Thử khởi động lại</button>
  </div>
<script src="app.js"></script>
</body>
</html>
