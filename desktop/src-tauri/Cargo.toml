[package]
name = "byscom-render-desktop"
version = "1.3.1"
description = "Byscom Render desktop shell — launches the FastAPI backend and shows it in a native window"
edition = "2021"

[lib]
name = "byscom_render_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
